name: build-x64-deb

# 上游没有 .github/workflows，本文件是纯新增；手动同步上游后重跑即可。
on:
  workflow_dispatch:
    inputs:
      make_release:
        description: '同时发布 Release 并附上 deb'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - 'linux/**'
      - 'packaging/**'
      - '.github/workflows/build-deb.yml'

permissions:
  contents: write

jobs:
  build:
    # 构建机 = 24.04 LTS：工具链的指令集基线仍是 x86-64（v1）。
    # 26.04 的基线已抬到 x86-64-v3（要 AVX2），而目标机 Surface 3 的
    # Atom x7-Z8700 没有 AVX —— 在 26.04 上编出来的程序一启动就被 glibc
    # 拦下："CPU ISA level is lower than required"。所以退回 24.04。
    # 代价：链接的是 libjsoncpp.so.25（26.04 只有 .26），因此 build-deb.sh
    # 会把该 .so 一并打进 deb，运行时由 wrapper 的 LD_LIBRARY_PATH 命中。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 上游把 lib/services/dandan_play_keys.dart 加进 .gitignore（含私有 AppSecret），
      # 仓库里没有这个文件，CI 冷启动必然编译失败。这里按 Secrets 生成：
      # 配了 DANDAN_APP_ID / DANDAN_APP_SECRET 就能用弹弹play 弹幕；
      # 没配则留空，只影响该功能，不影响构建与其余播放能力。
      - name: 生成弹弹play 密钥文件
        env:
          DANDAN_APP_ID: ${{ secrets.DANDAN_APP_ID }}
          DANDAN_APP_SECRET: ${{ secrets.DANDAN_APP_SECRET }}
        run: |
          if [ -f lib/services/dandan_play_keys.dart ]; then
            echo "文件已存在，跳过生成"
            exit 0
          fi
          cat > lib/services/dandan_play_keys.dart <<'EOF'
          /// CI 生成：真实密钥由仓库 Secrets 注入，不入库。
          const String kDandanPlayAppId = '__APP_ID__';
          const String kDandanPlayAppSecret = '__APP_SECRET__';
          EOF
          python3 - "$DANDAN_APP_ID" "$DANDAN_APP_SECRET" <<'PY'
          import sys, pathlib
          p = pathlib.Path('lib/services/dandan_play_keys.dart')
          s = p.read_text()
          s = s.replace('__APP_ID__', sys.argv[1]).replace('__APP_SECRET__', sys.argv[2])
          p.write_text(s)
          PY
          echo "已生成，appId 长度=${#DANDAN_APP_ID}"

      # 按用户要求「Flutter 版本跟上游」：用 stable，不硬 pin。
      # 若某次新版 Flutter 引入 Linux/Wayland 回归，临时加 flutter-version: 锁定，
      # 或先跑 tools/disable-impeller.sh。
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version

      - name: 系统依赖
        run: |
          sudo apt-get update
          # 构建必需：一律硬失败，缺一个就说明镜像变了，及时暴露比糊过去好
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config g++ libgtk-3-dev \
            libmpv-dev mpv libepoxy-dev libsecret-1-dev libjsoncpp-dev libasound2-dev \
            libva-dev dpkg-dev ca-certificates
          # 可选：VA-API 驱动只影响运行期硬件解码，缺了不该拦住构建
          sudo apt-get install -y --no-install-recommends \
            intel-media-va-driver vainfo || echo "⚠ VA-API 相关包未装全（不影响构建）"
          pkg-config --modversion gtk+-3.0
          pkg-config --modversion epoxy
          ldconfig -p | grep -E 'libmpv|libepoxy|libjsoncpp' || true

      - name: 兜底生成 Linux runner
        run: |
          if [ ! -d linux ]; then
            flutter create --platforms=linux --project-name moumou --org com.azxcvn .
            bash tools/patch-linux-runner.sh
          fi

      - name: pub get
        run: flutter pub get

      # 本仓库首版不含 linux/（它是 flutter create 的生成物），由 CI 生成后
      # 作为 artifact 带出来，取回提交进仓库，之后每次构建就不再走 create 分支。
      # 放在构建之前：即使后面构建失败，骨架也能拿到。
      - name: 带出 linux 骨架与 pubspec.lock
        run: tar -czf linux-runner.tar.gz linux pubspec.lock

      - uses: actions/upload-artifact@v4
        with:
          name: linux-runner-skeleton
          path: linux-runner.tar.gz
          if-no-files-found: error

      - name: 静态检查（不阻断，仅留日志便于排障）
        continue-on-error: true
        run: flutter analyze --no-pub || true

      # 指令集显式钉在 x86-64-v2（SSE4.2/POPCNT，不含 AVX）：目标机 Surface 3 是
      # Atom x7-Z8700（Airmont），无 AVX。24.04 的默认基线本来就是 x86-64，这里
      # 只是加一道保险，防某个依赖或镜像变更悄悄抬高基线。
      # （26.04 上就是栽在这：默认基线 v3，程序一启动被 glibc 拦下。）
      #
      # -Wno-error / -Wno-deprecated-literal-operator：flutter_secure_storage_linux
      # 自带的 json.hpp 里 `operator "" _json` 会被较新 clang 报
      # -Wdeprecated-literal-operator，插件又带 -Werror，于是编译中断。那份头文件
      # 在 pub cache 里改不了，只能把这类第三方告警降级（我们自己的告警仍会打印）。
      - name: 构建
        env:
          CFLAGS: "-O2 -march=x86-64-v2 -mtune=generic"
          CXXFLAGS: "-O2 -march=x86-64-v2 -mtune=generic -Wno-error -Wno-deprecated-literal-operator"
        run: |
          uname -a
          gcc --version | head -1
          flutter build linux --release

      - name: ldd 校验（缺库会让 deb 装完起不来）
        run: |
          ldd build/linux/x64/release/bundle/moumou | tee ldd.txt
          if grep -q "not found" ldd.txt; then
            echo "✗ 有未解析的动态库，检查 control 的 Depends"; exit 1
          fi
          echo "✓ 动态库齐全"
          # 顺手记录可执行文件的指令集属性要求（有则打印，没有就说明基线很老很安全）
          readelf -n build/linux/x64/release/bundle/moumou | grep -i "ISA level" || echo "（无 ISA level 属性注记，即未要求高于 x86-64）"

      - name: 组装 deb
        run: |
          chmod +x packaging/build-deb.sh packaging/wrapper.sh
          bash packaging/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: xiaomiao-player-amd64
          path: '*.deb'
          if-no-files-found: error

      - name: 发布 Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.make_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep '^version:' pubspec.yaml | head -1 | sed 's/.*version: *//; s/+.*//')
          gh release create "v${VER}-linux4" ./*.deb             --title "xiaomiao-player ${VER} (Linux x64)"             --notes "基于 commit ${{ github.sha }} 构建。GPL-3.0，完整对应源码见本仓库该 commit 及 LICENSE / THIRD_PARTY_NOTICES.md。"
